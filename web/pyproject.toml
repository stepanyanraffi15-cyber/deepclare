[project]
name = "deepclare-web"
version = "0.1.0"
description = "DeepClare public website: landing, pricing and policy pages"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "jinja2>=3.1",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["deepclare_web*"]

[tool.setuptools.package-data]
deepclare_web = ["templates/*.html", "static/*.css", "static/*.js", "static/img/*.svg", "static/img/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
