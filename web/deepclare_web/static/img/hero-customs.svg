<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="Մաքսատուն, բեռնատար և ինքնաթիռ">
  <!-- sun & clouds -->
  <circle cx="898" cy="62" r="26" fill="#fde68a"/>
  <g fill="#e0f2fe">
    <ellipse cx="140" cy="64" rx="52" ry="18"/>
    <ellipse cx="182" cy="52" rx="38" ry="14"/>
    <ellipse cx="796" cy="112" rx="46" ry="15"/>
    <ellipse cx="758" cy="102" rx="30" ry="12"/>
  </g>

  <!-- plane with contrail -->
  <line x1="58" y1="95" x2="192" y2="95" stroke="#bfdbfe" stroke-width="4" stroke-dasharray="12 9" stroke-linecap="round"/>
  <g>
    <path d="M207 84 l-18 -20 h22 l12 20 z" fill="#1e3a8a"/>
    <rect x="200" y="84" width="132" height="22" rx="11" fill="#3b82f6"/>
    <path d="M258 106 l-28 30 h24 l22 -30 z" fill="#1e3a8a"/>
    <path d="M258 84 l-20 -24 h19 l15 24 z" fill="#60a5fa"/>
    <circle cx="242" cy="95" r="3.2" fill="#fff"/>
    <circle cx="258" cy="95" r="3.2" fill="#fff"/>
    <circle cx="274" cy="95" r="3.2" fill="#fff"/>
    <circle cx="290" cy="95" r="3.2" fill="#fff"/>
    <circle cx="321" cy="95" r="11" fill="#1e3a8a"/>
  </g>

  <!-- dashed route from truck to customs house -->
  <path d="M120 320 C 260 180, 430 160, 600 296" fill="none" stroke="#93c5fd" stroke-width="3" stroke-dasharray="9 9"/>

  <!-- ground & road -->
  <rect x="0" y="336" width="960" height="64" fill="#e2e8f0"/>
  <rect x="0" y="344" width="960" height="32" fill="#475569"/>
  <line x1="0" y1="360" x2="960" y2="360" stroke="#f8fafc" stroke-width="4" stroke-dasharray="26 22"/>

  <!-- customs house -->
  <g>
    <path d="M588 196 h244 l-20 -34 h-204 z" fill="#1e40af"/>
    <rect x="600" y="196" width="220" height="140" fill="#ffffff"/>
    <rect x="600" y="196" width="14" height="140" fill="#e2e8f0"/>
    <rect x="634" y="212" width="152" height="30" rx="6" fill="#1e40af"/>
    <text x="710" y="233" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">ՄԱՔՍԱՏՈՒՆ</text>
    <rect x="690" y="272" width="40" height="64" rx="4" fill="#1e3a8a"/>
    <circle cx="722" cy="306" r="2.5" fill="#bfdbfe"/>
    <rect x="624" y="262" width="36" height="30" rx="4" fill="#bfdbfe"/>
    <rect x="762" y="262" width="36" height="30" rx="4" fill="#bfdbfe"/>
    <!-- flag of Armenia -->
    <line x1="802" y1="162" x2="802" y2="106" stroke="#64748b" stroke-width="3"/>
    <rect x="802" y="106" width="44" height="9" fill="#d90012"/>
    <rect x="802" y="115" width="44" height="9" fill="#0033a0"/>
    <rect x="802" y="124" width="44" height="9" fill="#f2a800"/>
  </g>

  <!-- inspection booth + raised barrier -->
  <g>
    <rect x="502" y="268" width="10" height="70" fill="#64748b"/>
    <g transform="rotate(-24 508 273)">
      <rect x="378" y="266" width="132" height="11" rx="5.5" fill="#ffffff"/>
      <rect x="388" y="266" width="24" height="11" fill="#ef4444"/>
      <rect x="436" y="266" width="24" height="11" fill="#ef4444"/>
      <rect x="484" y="266" width="24" height="11" fill="#ef4444"/>
    </g>
    <rect x="506" y="252" width="54" height="84" fill="#f8fafc"/>
    <rect x="500" y="242" width="66" height="12" rx="4" fill="#1e40af"/>
    <rect x="516" y="266" width="34" height="26" rx="3" fill="#bfdbfe"/>
  </g>

  <!-- cargo crates -->
  <g>
    <rect x="840" y="298" width="38" height="38" rx="3" fill="#f59e0b"/>
    <line x1="859" y1="298" x2="859" y2="336" stroke="#b45309" stroke-width="3"/>
    <line x1="840" y1="317" x2="878" y2="317" stroke="#b45309" stroke-width="3"/>
    <rect x="884" y="308" width="30" height="28" rx="3" fill="#fbbf24"/>
    <line x1="899" y1="308" x2="899" y2="336" stroke="#b45309" stroke-width="3"/>
  </g>

  <!-- container truck -->
  <g>
    <rect x="100" y="246" width="180" height="84" rx="6" fill="#1e40af"/>
    <rect x="100" y="246" width="180" height="18" rx="6" fill="#3b82f6"/>
    <text x="190" y="303" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" letter-spacing="1" fill="#ffffff">DEEPCLARE</text>
    <path d="M286 330 v-54 q0 -10 10 -10 h30 q9 0 13 8 l14 28 q5 9 5 16 v12 z" fill="#3b82f6"/>
    <path d="M296 276 h26 l11 22 h-37 z" fill="#bfdbfe"/>
    <rect x="100" y="330" width="260" height="10" rx="3" fill="#1f2937"/>
    <g fill="#1f2937">
      <circle cx="136" cy="346" r="15"/>
      <circle cx="196" cy="346" r="15"/>
      <circle cx="256" cy="346" r="15"/>
      <circle cx="326" cy="346" r="15"/>
    </g>
    <g fill="#94a3b8">
      <circle cx="136" cy="346" r="6.5"/>
      <circle cx="196" cy="346" r="6.5"/>
      <circle cx="256" cy="346" r="6.5"/>
      <circle cx="326" cy="346" r="6.5"/>
    </g>
  </g>
</svg>
