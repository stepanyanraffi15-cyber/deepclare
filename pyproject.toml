[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepclare"
version = "0.1.0"
description = "EAEU/Armenia customs import declaration drafting"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Only test_*.py is collected. tests/ also holds check_*.py scripts that call the live
# provider and cost tokens; those are run by hand and must never be collected.
python_files = ["test_*.py"]
